[package]
name = "ghreviewer-core"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["process", "time", "sync", "macros", "rt", "io-util"] }
reqwest = { version = "0.13.5", default-features = false, features = [
  "json",
  "rustls",
  "http2",
  "gzip",
] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
toml = "1.2.1"
toml_edit = "0.25.19"
notify = "8.2.2"
dirs = "7.0.0"
anyhow = "1.0.104"
