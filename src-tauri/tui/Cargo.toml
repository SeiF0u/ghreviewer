[package]
name = "ghreviewer-tui"
version = "0.1.0"
edition = "2024"

[dependencies]
ansi-to-tui = "8.0.1"
anyhow = "1.0.104"
ghreviewer-core = { version = "0.1.0", path = "../core" }
html2text = "0.17.4"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
# `Paragraph::line_count`, to stop scrolling at the last page.
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
